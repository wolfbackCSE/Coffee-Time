<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Coffee Time...</title>
</head>
<body>
  <p>Loading Coffee Time...</p>
  <script>
    (async function () {
      try {
        var response = await fetch('/index.html');
        if (!response.ok) throw new Error('Unable to load the app shell.');
        document.open();
        document.write(await response.text());
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p>Could not load Coffee Time. <a href="/">Return home</a>.</p>';
      }
    }());
  </script>
</body>
</html>
