<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Coffee Time...</title>
</head>
<body>
  <p>Loading Coffee Time...</p>
  <script>
    (async function () {
      try {
        var path = window.location.pathname;
        var marker = path.indexOf('/places/');
        var base = marker >= 0 ? path.slice(0, marker + 1)
          : (path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1));
        var response = await fetch(base + 'index.html');
        if (!response.ok) throw new Error('Unable to load the app shell.');
        document.open();
        document.write(await response.text());
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p>Could not load Coffee Time. <a href="' + base + '">Return home</a>.</p>';
      }
    }());
  </script>
</body>
</html>
